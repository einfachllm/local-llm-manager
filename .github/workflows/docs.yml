name: Docs

# Builds the documentation site (MkDocs + Material) and publishes it to the gh-pages branch with mike:
# every push to main updates the "dev" version, every release tag vX.Y.Z adds that version as "stable".
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["docs/**", "mkdocs.yml", "docs-requirements.txt", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "docs-requirements.txt", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs-requirements.txt
      - run: mkdocs build --strict

  deploy:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # mike commits the built site to gh-pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r docs-requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
      - name: Publish "dev" (main)
        if: github.ref == 'refs/heads/main'
        run: |
          mike deploy --push dev
          # Until the first release has docs, the site's root opens "dev".
          mike list --json | python -c "import json,sys; sys.exit(0 if any('stable' in v['aliases'] for v in json.load(sys.stdin)) else 1)" \
            || mike set-default --push dev
      - name: Publish the release as "stable"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "${version%.*}" stable
          mike set-default --push stable
