# Compact recipe file (Local LLM Manager): paste into + Add recipe.
# Hermes Agent gateway in Docker - no model or GPU. health_path is empty because the gateway
# opens no HTTP port; --add-host lets the container reach the LLM on the host via
# http://host.docker.internal:<port>/v1.
name: hermes-agent-docker
description: Hermes Agent gateway (Docker), no model or GPU
framework: custom
# Hermes changes fast, so this deliberately tracks :latest - pin a tag for reproducibility.
image: nousresearch/hermes-agent:latest
command: gateway run
docker_args: --add-host=host.docker.internal:host-gateway
env: |-
  TELEGRAM_BOT_TOKEN
  TELEGRAM_ALLOWED_USERS
  EINFACHLLM_API_KEY
  HERMES_LOCAL_STT_LANGUAGE=de
  HERMES_UID=1000
  HERMES_GID=1000
volumes: ~/.hermes:/opt/data
host_port: 8198
container_port: 8198
health_path: ''
kind: agent
