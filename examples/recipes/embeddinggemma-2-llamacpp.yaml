# Compact recipe file (Local LLM Manager): paste into Recipes -> Import.
# EmbeddingGemma 2 (UD-Q4_K_XL) as an OpenAI-compatible embeddings server via llama.cpp.
# Tested: GET /v1/models and POST /v1/embeddings (768-dim, L2-normalized) on port 8105.
name: embeddinggemma-2
description: EmbeddingGemma 2 (UD-Q4_K_XL) via llama.cpp - OpenAI /v1/embeddings
framework: llamacpp
image: ghcr.io/ggml-org/llama.cpp:server-cuda
args: |-
  --alias embeddinggemma-2
  --embeddings
  --pooling mean
  --ctx-size 2048
  --batch-size 2048
  --ubatch-size 2048
  --parallel 1
  -ngl 999
volumes: |-
  ~/models:/models:ro
host_port: 8105
model: /models/embeddinggemma-2-UD-Q4_K_XL.gguf
color: green
