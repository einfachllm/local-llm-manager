# Compact recipe file (Local LLM Manager): paste into + Add recipe.
name: qwen38-27b-sglang
description: Qwen3.8-27B-NVFP4 with the DFlash2 drafter, SGLang
framework: sglang
image: lmsysorg/sglang:v0.5.23
args: |-
  --served-model-name qwen3.8
  --context-length 262144
  --max-running-requests 4
  --mem-fraction-static 0.80
  --chunked-prefill-size 16384
  --kv-cache-dtype fp8_e4m3
  --attention-backend flashinfer
  --enable-metrics
  --disable-radix-cache
  --speculative-algorithm DFLASH
  --speculative-draft-model-path /drafter
  --speculative-num-draft-tokens 8
volumes: |-
  {weights:Qwen3.8-27B-NVFP4}:/Qwen3.8-27B-NVFP4:ro
  {weights:Qwen3.8-27B-DFlash2}:/drafter:ro
  ~/.cache/huggingface:/root/.cache/huggingface
host_port: 8101
weights:
- Qwen3.8-27B-DFlash2
- Qwen3.8-27B-NVFP4
model: /Qwen3.8-27B-NVFP4
container_name: qwen3.8-sglang
tags:
- qwen3.8
- dflash2
color: teal