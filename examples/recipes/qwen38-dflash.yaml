# Compact recipe file (Local LLM Manager): paste into + Add recipe.
name: qwen38-27b-dflash
description: Qwen3.8-27B-NVFP4 with the DFlash2 drafter via vLLM
framework: vllm
image: vllm/vllm-openai:v0.33.0
args: |-
  --served-model-name qwen3.8
  --gpu-memory-utilization 0.84
  --max-model-len 262144
  --max-num-seqs 4
  --max-num-batched-tokens 16384
  --kv-cache-dtype fp8
  --trust-remote-code
  --enable-auto-tool-choice
  --tool-call-parser qwen3_xml
  --reasoning-parser qwen3
  --async-scheduling
  --no-enable-prefix-caching
  --speculative-config '{"method":"dflash","model":"/drafter","num_speculative_tokens":7}'
volumes: |-
  {weights:Qwen3.8-27B-NVFP4}:/Qwen3.8-27B-NVFP4:ro
  {weights:Qwen3.8-27B-DFlash2}:/drafter:ro
  ~/.cache/huggingface:/root/.cache/huggingface
host_port: 8101
weights:
- Qwen3.8-27B-DFlash2
- Qwen3.8-27B-NVFP4
model: /Qwen3.8-27B-NVFP4
container_name: qwen3.8-dflash
color: blue
