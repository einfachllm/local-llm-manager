services:
  local-llm-manager:
    # Prebuilt image from CI (amd64 + arm64). `docker compose up -d --build` builds it locally instead.
    # :latest is moved by hand after each release (Actions -> Docker latest -> Run workflow on main),
    # so `docker compose pull && docker compose up -d` upgrades to the newest release.
    image: ghcr.io/einfachllm/local-llm-manager:latest
    build: .
    container_name: local-llm-manager
    restart: unless-stopped
    # Host networking so model health checks on 127.0.0.1:<port> reach the model containers.
    network_mode: host
    env_file: .env
    environment:
      # Volume paths in recipes (e.g. ~/.cache/huggingface) are resolved by the HOST docker daemon,
      # so "~" must expand to the host user's home, not /root.
      HOME: ${HOME}
      # Schedules use the host's zone via /etc/localtime (mounted below). For DST-correct cron the
      # zone must be resolvable BY NAME: on hosts where /etc/localtime is not a symlink, uncomment
      # TZ (and/or the /etc/timezone mount below) — e.g. TZ: Europe/Berlin.
      # TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      # Schedules run in the host's time zone (the container would otherwise use UTC).
      - /etc/localtime:/etc/localtime:ro
      # Debian/Ubuntu hosts: the zone NAME for DST-correct schedules (see TZ above). Uncomment only
      # if the host has this file — Docker would otherwise create an empty directory on the host.
      # - /etc/timezone:/etc/timezone:ro
      # The script importer runs starter scripts with the host HOME so their preflight checks
      # (model dir, drafters under ~/models) see the real files. Read-only; nothing is written here.
      - ${HOME}:${HOME}:ro
    # NVIDIA GPU readings: docker-compose.nvidia.yml. Tailscale mode: docker-compose.tailscale.yml.
    # Combine: docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
