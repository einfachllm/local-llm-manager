# Compact recipe file (Local LLM Manager): paste into + Add recipe.
name: qwen38-27b-tensorfold
description: Qwen3.8-27B-NVFP4 with the DFlash2 drafter, TensorFold 1.2.9
framework: tensorfold
runtime: docker
image: tensorfold:1.2.9-cuda
command: /opt/tf129/bin/tensorfold-native serve {model} --host {bind_host} --port {port}
args: |-
  --name qwen3.8
  --drafter /models/Qwen3.8-27B-DFlash2
  --context 262144
  --parallel 2
  --no-update-check
  --vision
volumes: '{weights}:/models:ro'
host_port: 8101
container_port: 8101
weights: models
model: /models/Qwen3.8-27B-NVFP4
container_name: qwen38-27b-tf
tags:
- tensorfold
- qwen3.8
- nvfp4
- dflash2
- gb10
color: pink