# Compact recipe file (Local LLM Manager): paste into Recipes -> Import.
# Qwen3.8-27B (NVFP4) served by vLLM with the model's own MTP drafts - the smallest recipe here, and the
# one a fresh install starts with. It mounts the model alone (`weights:` = that folder), so "Search hosts"
# in the Weights tab registers it by itself; the drafter recipes share a parent folder instead.
# The vLLM preset fills in the command, Docker flags, the Hugging Face cache volume and HF_TOKEN.
name: qwen3.8-mtp
description: Qwen3.8-27B-NVFP4 via vLLM with MTP speculative decoding
framework: vllm
image: vllm/vllm-openai:v0.32.0
weights: Qwen3.8-27B-NVFP4
host_port: 8101
args: |
  --gpu-memory-utilization 0.4
  --max-model-len 226000
  --max-num-seqs 8
  --served-model-name qwen3.8
  --kv-cache-dtype fp8
  --speculative-config '{"method":"mtp","num_speculative_tokens":4}'
