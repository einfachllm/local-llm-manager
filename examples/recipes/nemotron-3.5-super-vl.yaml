name: nemotron-3.5-super-vl
framework: vllm
image: vllm/vllm-openai:v0.33.0
weights:
  - NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
  - NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr
model: /NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
host_port: 8100
args: |
  --served-model-name nemotron-3.5-super-vl
  --max-num-seqs 1
  --trust-remote-code
  --gpu-memory-utilization 0.75
  --max-num-batched-tokens 8192
  --speculative-config '{"method":"dflash","model":"/models/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr","num_speculative_tokens":7,"rejection_sample_method":"standard","attention_backend":"FLASHINFER","draft_load_config":{"load_format":"auto"}}'
  --mamba-backend flashinfer
  --mamba-ssm-cache-dtype float16
  --enable-mamba-cache-stochastic-rounding
  --mamba-cache-philox-rounds 5
  --enable-mamba-shared-prefix-checkpoint
  --video-pruning-rate 0.5
  --media-io-kwargs '{"video": {"fps": 2, "num_frames": 256}}'
  --block-size 64
  --prefix-match-unit 64
  --enable-auto-tool-choice
  --tool-call-parser qwen3_coder
  --reasoning-parser nemotron_v3
volumes: |-
  {weights:NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4}:/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4:ro
  {weights:NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr}:/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr:ro
  ~/.cache/huggingface:/root/.cache/huggingface
  color: blue