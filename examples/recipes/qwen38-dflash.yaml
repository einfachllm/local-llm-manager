# Compact recipe file (Local LLM Manager): paste into Recipes -> Import.
# Qwen3.8-27B (NVIDIA ModelOpt NVFP4) with the DFlash2 drafter, served by vLLM on one NVIDIA DGX Spark.
# Register the parent folder that holds both models (e.g. ~/models) as "Qwen3.8-Models" in the Weights
# tab, or change `weights:` and the /models paths below - one entry covers model and drafter.
# The vLLM preset fills in the command, Docker flags, the Hugging Face cache volume and HF_TOKEN.
name: qwen3.8-dflash
description: Qwen3.8-27B-NVFP4 with the DFlash2 drafter via vLLM - speculative decoding
framework: vllm
image: vllm/vllm-openai:v0.33.0
weights: Qwen3.8-Models
model: /models/Qwen3.8-27B-NVFP4
host_port: 8101
args: |
  --served-model-name qwen3.8
  --gpu-memory-utilization 0.84
  --max-model-len 262144
  --max-num-seqs 4
  --max-num-batched-tokens 16384
  --kv-cache-dtype fp8
  --trust-remote-code
  --enable-auto-tool-choice
  --tool-call-parser qwen3_xml
  --reasoning-parser qwen3
  --async-scheduling
  --no-enable-prefix-caching
  --speculative-config '{"method":"dflash","model":"/models/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
volumes: |-
  {weights}:/models:ro
  ~/.cache/huggingface:/root/.cache/huggingface
color: blue
