# Qwen3.8-27b with Dflash incoai/Qwen3.8-27B-DFlash2
name: qwen3.8-dflash
description: qwen3.8-27b
framework: vllm
image: vllm/vllm-openai:v0.33.0
args: |-
  --gpu-memory-utilization 0.84
  --max-model-len 262144
  --max-num-seqs 6
  --max-num-batched-tokens 16384
  --served-model-name qwen38
  --trust-remote-code
  --kv-cache-dtype fp8
  --enable-auto-tool-choice
  --tool-call-parser qwen3_xml
  --async-scheduling
  --reasoning-parser qwen3
  --no-enable-prefix-caching
  --speculative-config '{"method":"dflash","model":"/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
volumes: |-
  {weights}:/models:ro
  ~/.cache/huggingface:/root/.cache/huggingface
  ~/models/Qwen3.8-27B-DFlash2:/Qwen3.8-27B-DFlash2:ro
host_port: 8081
weights: Qwen3.8-Models
model: /models/Qwen3.8-27B-NVFP4
color: blue

