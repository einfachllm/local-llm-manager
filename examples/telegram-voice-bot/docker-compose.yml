# Telegram voice bot with a local Whisper server. The LLM is NOT part of this stack: run it as a recipe in
# Local LLM Manager, so you can switch and schedule it; the bot talks to its port (LLM_URL in .env).
#
#   cp .env.example .env && nano .env && docker compose up -d --build
services:
  whisper:
    # vLLM serves Whisper with an OpenAI-compatible /v1/audio/transcriptions endpoint.
    # The [audio] extra (librosa, soundfile) must be in the image; the official images include it.
    image: ${WHISPER_IMAGE:-vllm/vllm-openai:v0.11.0}
    command: >
      --model ${STT_MODEL:-openai/whisper-large-v3-turbo}
      --port 8000
      --gpu-memory-utilization ${WHISPER_GPU_SHARE:-0.08}
    # Only reachable from this machine; the bot uses the compose network.
    ports: ["127.0.0.1:8120:8000"]
    volumes: ["${HOME}/.cache/huggingface:/root/.cache/huggingface"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ipc: host
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 300s
    restart: unless-stopped

  bot:
    build: ./bot
    env_file: .env
    environment:
      STT_URL: http://whisper:8000/v1/audio/transcriptions
    # host.docker.internal = this machine, where Local LLM Manager runs the LLM recipe.
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      whisper:
        condition: service_healthy
    restart: unless-stopped
