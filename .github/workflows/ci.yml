name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        run: ruff check --output-format=github .
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh install-macos.sh uninstall.sh uninstall-macos.sh run.sh

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Native-process recipes are the main use case on a Mac.
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: bash 4+ for script import (macOS ships 3.2)
        if: runner.os == 'macOS'
        run: brew install bash
      - run: pip install -r requirements-dev.txt
      - name: Tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pytest -q --cov=local_llm_manager --cov-report=xml --cov-report=term
      - name: Tests
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.12'
        run: python -m pytest -q
      - name: Coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  image:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Catches Dockerfile breakage in PRs; publishing happens only in the release / Docker latest workflows.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Wheel ships the web UI
        run: unzip -l dist/*.whl | grep -q 'local_llm_manager/static/index.html'
      - name: Wheel ships the seed example (DGXM_SEED without the repo)
        run: unzip -l dist/*.whl | grep -q 'local_llm_manager/seed/qwen38-mtp.yaml'

