# Tailscale mode (DGXM_HOST / DGXM_PUBLISH_IP=tailscale): the image has no Tailscale CLI,
# so mount the host's binary and daemon socket read-only. Both paths must exist on the host.
# Usage: docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
services:
  local-llm-manager:
    volumes:
      - /usr/bin/tailscale:/usr/bin/tailscale:ro
      - /var/run/tailscale:/var/run/tailscale:ro
