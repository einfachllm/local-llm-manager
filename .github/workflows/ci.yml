name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff
        run: ruff check --output-format=github .
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh install-macos.sh run.sh

  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Native-process recipes are the main use case on a Mac.
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  package:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Wheel ships the web UI
        run: unzip -l dist/*.whl | grep -q 'local_llm_manager/static/index.html'

  docker:
    name: Docker image (amd64 + arm64)
    # Only checks that the image builds; images are published by release.yml, never from main.
    if: github.event_name != 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # DGX Spark is arm64, most laptops/servers amd64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker buildx build --load -t llm-manager-smoke .
          docker run -d --name llm-manager-smoke -p 18090:8090 -e DGXM_SEED=0 llm-manager-smoke
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18090/api/meta >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18090/api/meta | grep -q '"frameworks"'
          docker exec llm-manager-smoke docker --version
          docker rm -f llm-manager-smoke
